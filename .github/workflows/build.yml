name: Build NotepadAI

on:
  workflow_dispatch: 
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  pull_request:

env:
  QT_RELEASE_VER: 6.5

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─── Windows ───────────────────────────────────────────────
          - os: windows-2022
            platform: windows
            qt_version: "6.5"
          - os: windows-2022
            platform: windows
            qt_version: "6.8"
          - os: windows-2022
            platform: windows
            qt_version: "6.10"

          # ─── Windows (ARM) ─────────────────────────────────────────
          - os: windows-11-arm
            platform: windows
            qt_version: "6.8"
            qt_arch: win64_msvc2022_arm64
            vs_arch: arm64
            artifact_suffix: -arm64
          - os: windows-11-arm
            platform: windows
            qt_version: "6.10"
            qt_arch: win64_msvc2022_arm64
            vs_arch: arm64
            artifact_suffix: -arm64

          # ─── Linux ─────────────────────────────────────────────────
          - os: ubuntu-24.04
            platform: linux
            qt_version: "6.5"
          - os: ubuntu-24.04
            platform: linux
            qt_version: "6.8"
          - os: ubuntu-24.04
            platform: linux
            qt_version: "6.10"

          # ─── macOS Intel (x64) ─────────────────────────────────────
          - os: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.5"
            deployment_target: "11.0"
          - os: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.8"
            deployment_target: "12.0"
          - os: macos-15-intel
            platform: mac
            arch: x64
            cmake_arch: x86_64
            qt_arch: clang_64
            qt_version: "6.10"
            deployment_target: "13.0"

          # ─── macOS Apple Silicon (arm64) ───────────────────────────
          - os: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.5"
            deployment_target: "12.0"
          - os: macos-15
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.8"
            deployment_target: "13.0"
          - os: macos-26
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.10"
            deployment_target: "14.0"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # ─── Install Qt (Windows / Linux via jurplel) ──────────────
      - name: Install Qt
        if: matrix.platform != 'mac'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          modules: 'qt5compat'
          cache: true
          arch: ${{ matrix.qt_arch }}

      # ─── Install Qt (macOS via jdpurcell for arch support) ─────
      - name: Install Qt (mac)
        if: matrix.platform == 'mac'
        uses: jdpurcell/install-qt-action@v5
        with:
          version: ${{ matrix.qt_version }}
          host: mac
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qt5compat
          cache: true

      - name: Setup Visual Studio Tools
        if: matrix.platform == 'windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: ${{ matrix.vs_arch || 'x64' }}

      - name: Install NSIS
        if: matrix.platform == 'windows'
        uses: repolevedavaj/install-nsis@v1.3.0
        with:
          nsis-version: '3.11'

      - name: Setup Linux
        if: matrix.platform == 'linux'
        run: |
          echo "DISTRIBUTION=AppImage" >> "$GITHUB_ENV"
          if [[ "${{ matrix.qt_version }}" == "6.10" ]]; then
            echo "EXTRA_PLATFORM_PLUGINS=libqwayland.so" >> "$GITHUB_ENV"
          else
            echo "EXTRA_PLATFORM_PLUGINS=libqwayland-generic.so" >> "$GITHUB_ENV"
          fi
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 fuse libxcb-cursor-dev libcups2-dev

      - name: Set Distribution (mac)
        if: matrix.platform == 'mac'
        shell: bash
        run: echo "DISTRIBUTION=dmg" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          CMAKE_OPTS=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_DISTRIBUTION="${DISTRIBUTION}")
          if [ "${{ matrix.platform }}" = "mac" ]; then
            CMAKE_OPTS+=(-DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}")
          fi
          cmake "${CMAKE_OPTS[@]}"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          # Surface compiler errors as annotations so they are visible without downloading logs
          cmake --build build --parallel 2>&1 | tee build-output.log || {
            grep -E "error|FAILED" build-output.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Build Windows Targets
        if: matrix.platform == 'windows'
        run: cmake --build build --target package zip installer --parallel

      - name: Build MacOS Targets
        if: matrix.platform == 'mac'
        shell: bash
        run: cmake --build build --target dmg --parallel

      - name: Build Linux Targets
        if: matrix.platform == 'linux'
        run: cmake --build build --target appimage --parallel

      - name: Upload Windows zip Package
        uses: actions/upload-artifact@v7
        if: matrix.platform == 'windows'
        with:
          name: NotepadNext-Windows-Qt${{ matrix.qt_version }}${{ matrix.artifact_suffix }}-Zip
          path: ${{ github.workspace }}/build/package/

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v7
        if: matrix.platform == 'windows'
        with:
          name: NotepadNext-Windows-Qt${{ matrix.qt_version }}${{ matrix.artifact_suffix }}-Installer
          path: ${{ github.workspace }}/installer/NotepadAI*.exe

      - name: Upload MacOS dmg
        uses: actions/upload-artifact@v7
        if: matrix.platform == 'mac'
        with:
          name: NotepadNext-macOS-${{ matrix.arch }}-Qt${{ matrix.qt_version }}
          path: ${{ github.workspace }}/build/NotepadNext*.dmg

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        if: matrix.platform == 'linux'
        with:
          name: NotepadNext-Linux-Qt${{ matrix.qt_version }}-AppImage
          path: ${{ github.workspace }}/build/NotepadNext*.AppImage

  github:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Collect release files
        run: |
          mkdir dist
          cp NotepadNext-Windows-Qt6.10-Installer/*.exe "dist/NotepadAI-$TAG-Windows-Setup.exe"
          (cd NotepadNext-Windows-Qt6.10-Zip && zip -qr "../dist/NotepadAI-$TAG-Windows-Portable.zip" .)
          cp NotepadNext-Windows-Qt6.10-arm64-Installer/*.exe "dist/NotepadAI-$TAG-Windows-ARM64-Setup.exe"
          cp NotepadNext-Linux-Qt6.10-AppImage/*.AppImage "dist/NotepadAI-$TAG-Linux-x86_64.AppImage"
          cp NotepadNext-macOS-arm64-Qt6.10/*.dmg "dist/NotepadAI-$TAG-macOS-AppleSilicon.dmg"
          cp NotepadNext-macOS-x64-Qt6.10/*.dmg "dist/NotepadAI-$TAG-macOS-Intel.dmg"
          ls -la dist

      - name: Create Release
        run: |
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" --title "NotepadAI $TAG" --generate-notes
